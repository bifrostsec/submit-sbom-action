name: Submit SBOM to bifrost
description: Submits an SBOM file to the bifrost API for CVE tracking
author: bifrost security
branding:
  icon: 'upload'
  color: 'white'
inputs:
  api-token:
    description: Bearer token for Bifrost API authentication
    required: true
  service:
    description: Service name
    required: true
  service-version:
    description: Service version. Required unless image is provided.
    required: false
  image:
    description: Container image reference. Required unless service-version is provided.
    required: false
  sbom-path:
    description: >-
      Path to the SBOM file to submit, or a newline-separated list of paths.
    required: false
  dependency-graph:
    description: Export and submit the GitHub dependency graph SBOM for a repository
    required: false
    default: 'false'
  retry-attempts:
    description: Number of retry attempts for failed requests
    required: false
    default: '3'
  retry-delay:
    description: Delay in seconds between retry attempts
    required: false
    default: '2'
  api-host:
    description: Custom API host URL
    required: false
    default: https://portal.bifrostsec.com
runs:
  using: composite
  steps:
    - name: Warn When No SBOM Source Is Configured
      if: ${{ inputs.sbom-path == '' && inputs.dependency-graph != 'true' }}
      shell: bash
      run: echo '::warning::No SBOM source configured; no SBOM will be submitted.'

    - name: Export Dependency Graph SBOM
      id: dependency-graph-sbom
      if: ${{ inputs.dependency-graph == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/export-dependency-graph-sbom.sh"

    - name: Select CLI Release
      id: cli-release
      if: ${{ inputs.sbom-path != '' || steps.dependency-graph-sbom.outputs.dependency_graph_sbom_path != '' }}
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/scripts/select-cli-release.sh"
        echo "cli_path=${cli_path}" >> "$GITHUB_OUTPUT"
        echo "download_url=${download_url}" >> "$GITHUB_OUTPUT"
        echo "expected_sha=${expected_sha}" >> "$GITHUB_OUTPUT"
        echo "cache_key=${cache_key}" >> "$GITHUB_OUTPUT"

    - name: Restore CLI Cache
      # Outputs: cache-hit, cache-primary-key, cache-matched-key (provided by actions/cache/restore).
      id: cli-cache
      if: ${{ steps.cli-release.outputs.cli_path != '' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cli-release.outputs.cli_path }}
        key: ${{ steps.cli-release.outputs.cache_key }}

    - name: Install and Validate CLI
      id: install-cli
      if: ${{ steps.cli-release.outputs.cli_path != '' }}
      shell: bash
      env:
        CLI_PATH: ${{ steps.cli-release.outputs.cli_path }}
        CLI_DOWNLOAD_URL: ${{ steps.cli-release.outputs.download_url }}
        CLI_EXPECTED_SHA: ${{ steps.cli-release.outputs.expected_sha }}
        CLI_CACHE_HIT: ${{ steps.cli-cache.outputs.cache-hit }}
      run: |
        if [[ "${CLI_CACHE_HIT}" == 'true' ]]; then
          if bash "$GITHUB_ACTION_PATH/scripts/validate-cli.sh"; then
            exit 0
          fi
          echo '::warning::Cached Bifrost CLI failed validation; downloading it again.'
        fi

        bash "$GITHUB_ACTION_PATH/scripts/download-cli.sh"
        bash "$GITHUB_ACTION_PATH/scripts/validate-cli.sh"
        echo 'downloaded=true' >> "$GITHUB_OUTPUT"

    - name: Save CLI Cache
      if: ${{ steps.install-cli.outputs.downloaded == 'true' && steps.cli-cache.outcome == 'success' && steps.cli-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cli-release.outputs.cli_path }}
        key: ${{ steps.cli-release.outputs.cache_key }}

    - name: Upload SBOM
      if: ${{ inputs.sbom-path != '' || steps.dependency-graph-sbom.outputs.dependency_graph_sbom_path != '' }}
      shell: bash
      env:
        ACTION_API_TOKEN: ${{ inputs.api-token }}
        ACTION_SERVICE: ${{ inputs.service }}
        ACTION_SERVICE_VERSION: ${{ inputs.service-version }}
        ACTION_IMAGE: ${{ inputs.image }}
        ACTION_SBOM_PATH: ${{ inputs.sbom-path }}
        ACTION_DEPENDENCY_GRAPH_SBOM_PATH: ${{ steps.dependency-graph-sbom.outputs.dependency_graph_sbom_path }}
        ACTION_RETRY_ATTEMPTS: ${{ inputs.retry-attempts }}
        ACTION_RETRY_DELAY: ${{ inputs.retry-delay }}
        ACTION_API_HOST: ${{ inputs.api-host }}
        ACTION_GIT_REPO_PATH: ${{ github.workspace }}
        ACTION_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        CLI_PATH: ${{ steps.cli-release.outputs.cli_path }}
      run: bash "$GITHUB_ACTION_PATH/scripts/upload-sbom.sh"
